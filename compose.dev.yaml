name: teamsync-dev
services:
  db:
    image: postgres:17.5
    environment:
      POSTGRES_USER: teamsync
      POSTGRES_DB: teamsync
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U teamsync -d teamsync]
      interval: 3s
      timeout: 3s
      retries: 20
  queue:
    image: redis:7.4.4
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes: [queue-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
  cache:
    image: redis:7.4.4
    command: [redis-server, --maxmemory, 64mb, --maxmemory-policy, allkeys-lru]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    image: teamsync-backend:dev
    build:
      context: .
      dockerfile: server/Dockerfile
    command: [python, -m, alembic, -c, server/alembic.ini, upgrade, head]
    secrets: [db_password]
    depends_on:
      db: {condition: service_healthy}
  api:
    image: teamsync-backend:dev
    build:
      context: .
      dockerfile: server/Dockerfile
    command: [python, -m, uvicorn, server.app.main:create_app, --factory, --host, 0.0.0.0, --port, '8090']
    environment:
      TEAMSYNC_STATIC_DIR: /app/web/dist
    secrets: [db_password, bootstrap_token]
    ports: ['127.0.0.1:8090:8090']
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/ready')"]
      interval: 5s
      timeout: 3s
      retries: 12
  worker:
    image: teamsync-backend:dev
    build:
      context: .
      dockerfile: server/Dockerfile
    command: [python, -m, celery, -A, server.app.worker:celery_app, worker, --loglevel, warning, --concurrency, '1']
    secrets: [db_password]
    depends_on:
      migrate: {condition: service_completed_successfully}
      queue: {condition: service_healthy}
  scheduler:
    image: teamsync-backend:dev
    build:
      context: .
      dockerfile: server/Dockerfile
    command: [python, -m, server.app.scheduler]
    secrets: [db_password]
    depends_on:
      migrate: {condition: service_completed_successfully}
      queue: {condition: service_healthy}
secrets:
  db_password:
    file: .local/server/db_password
  bootstrap_token:
    file: .local/server/bootstrap_token
volumes:
  pg-data:
  queue-data:
