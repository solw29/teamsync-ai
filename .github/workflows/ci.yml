name: TeamSync CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      case_id:
        description: Optional phase-2 synthetic contract evaluation (one LLM call)
        required: false
        type: choice
        default: ''
        options: ['', S01, S02, S03, S04, S05, S06]

permissions:
  contents: read

concurrency:
  group: teamsync-ci-${{ github.event.pull_request.number || github.ref }}-${{ inputs.case_id || 'checks' }}
  cancel-in-progress: true

jobs:
  checks:
    name: Ruff and pytest
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'workflow_dispatch' || inputs.case_id == '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check .

      - name: Run pytest
        run: pytest -q

  model-prepare:
    if: github.event_name == 'workflow_dispatch' && inputs.case_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]'
      - run: python -m teamsync.phase2_model_eval prepare --case "$CASE_ID"
        env:
          CASE_ID: ${{ inputs.case_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: model-input
          path: artifacts/model/
  model-analyze:
    needs: model-prepare
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - uses: actions/download-artifact@v4
        with:
          name: model-input
          path: artifacts/model
      - run: python -m teamsync.phase2_model_eval generate
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
      - uses: actions/upload-artifact@v4
        with:
          name: model-analysis
          path: artifacts/model/analysis.json
  model-runner:
    needs: model-analyze
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - uses: actions/download-artifact@v4
        with:
          name: model-input
          path: artifacts/model
      - uses: actions/download-artifact@v4
        with:
          name: model-analysis
          path: artifacts/model
      - run: docker build -f Dockerfile.runner -t teamsync-runner .
      - name: Run the identical new drafts on both isolated code versions
        run: |
          chmod 755 artifacts/model/buggy artifacts/model/fixed
          chmod 644 artifacts/model/buggy/*.py artifacts/model/fixed/*.py artifacts/model/*.json
          for version in buggy fixed; do
            mkdir -p "artifacts/model/result-$version"
            chmod 777 "artifacts/model/result-$version"
            docker run --rm --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges --pids-limit 64 --memory 768m --cpus 1 \
              --tmpfs /tmp:rw,noexec,nosuid,size=32m \
              -v "$PWD/artifacts/model/$version:/target:ro" \
              -v "$PWD/artifacts/model:/input:ro" \
              -v "$PWD/artifacts/model/runner-policy.json:/opt/teamsync/teamsync-policy.json:ro" \
              -v "$PWD/artifacts/model/result-$version:/output:rw" \
              -e TEAMSYNC_DISPOSABLE_RUNNER=1 -e TEAMSYNC_ISOLATED_CONTAINER=1 \
              teamsync-runner execute --target /target --artifacts /input --output /output
          done
          python -m teamsync.phase2_model_eval summarize
      - uses: actions/upload-artifact@v4
        with:
          name: model-evaluation
          path: artifacts/model/
