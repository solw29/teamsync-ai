[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "teamsync-ai"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.28,<1"]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "celery[redis]>=5.4,<6", "redis>=5,<7"]
phase2 = ["pyright>=1.1.400,<2", "pytest-cov>=6,<8"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["teamsync*", "server*"]

[tool.setuptools.package-data]
teamsync = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests", "test_checks.py"]
